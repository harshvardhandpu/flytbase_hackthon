{% extends "base.html" %}
{% set active_nav = "inbound" %}

{% block heading %}Inbound Messages{% endblock %}

{% block content %}
<div x-data="inboundApp()" x-init="init()" class="space-y-6">
  <!-- Skeleton loading -->
  <div x-show="loading" class="space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <template x-for="i in 3" :key="i">
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <div class="skeleton skeleton-text-sm"></div>
          <div class="skeleton skeleton-text w-12 mt-2"></div>
        </div>
      </template>
    </div>
    <template x-for="i in 3" :key="i">
      <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-5">
        <div class="flex items-center gap-3">
          <div class="skeleton skeleton-circle"></div>
          <div class="flex-1">
            <div class="skeleton skeleton-text w-1/3"></div>
            <div class="skeleton skeleton-text-sm w-2/3 mt-1"></div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <template x-if="!loading">
    <div class="space-y-6">
      <!-- Stats bar -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Pending Review</span>
          <div class="text-2xl font-semibold text-yellow-400 mt-1" x-text="messages.filter(m => m.status === 'pending_review').length">0</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Approved</span>
          <div class="text-2xl font-semibold text-green-400 mt-1" x-text="messages.filter(m => m.status === 'approved').length">0</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Rejected</span>
          <div class="text-2xl font-semibold text-red-400 mt-1" x-text="messages.filter(m => m.status === 'rejected').length">0</div>
        </div>
      </div>

      <!-- Empty state -->
      <template x-if="messages.length === 0">
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-12 text-center">
          <span class="text-4xl block mb-3">📨</span>
          <p class="text-slate-500 text-sm">No inbound messages yet. Messages will appear here when leads reply or reach out.</p>
        </div>
      </template>

      <!-- Messages list -->
      <div class="space-y-3">
        <template x-for="msg in messages" :key="msg.task_id">
          <div class="bg-slate-800 rounded-xl border border-slate-700/50 overflow-hidden transition-all duration-200"
               :class="{ 'ring-2 ring-yellow-500/30 border-yellow-500/30': msg.status === 'pending_review' }">
            <!-- Header row (clickable to expand) -->
            <div class="flex items-start gap-4 p-5 cursor-pointer hover:bg-slate-700/30 transition-colors"
                 @click="toggleExpand(msg.task_id)">
              <!-- Sender avatar -->
              <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-500/20 to-blue-500/20 border border-cyan-500/20 flex items-center justify-center flex-shrink-0">
                <span class="text-sm font-semibold text-cyan-400" x-text="(msg.from_name || msg.from_email || '?')[0].toUpperCase()"></span>
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-0.5">
                  <span class="text-sm font-medium text-slate-200" x-text="msg.from_name || msg.from_email || 'Unknown'"></span>
                  <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium"
                        :class="{
                          'bg-yellow-900/30 text-yellow-400 border border-yellow-800': msg.status === 'pending_review',
                          'bg-green-900/30 text-green-400 border border-green-800': msg.status === 'approved',
                          'bg-red-900/30 text-red-400 border border-red-800': msg.status === 'rejected'
                        }"
                        x-text="msg.status?.replace('_', ' ')"></span>
                </div>
                <p class="text-sm text-slate-400 truncate" x-text="msg.subject || '(No subject)'"></p>
                <div class="flex items-center gap-3 mt-1 text-xs text-slate-500">
                  <span class="flex items-center gap-1">
                    <span>📧</span>
                    <span x-text="msg.channel || 'email'"></span>
                  </span>
                  <span x-text="timeAgo(msg.created_at)"></span>
                  <template x-if="msg.analysis_intent">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-700/50 capitalize"
                          x-text="msg.analysis_intent"></span>
                  </template>
                  <template x-if="msg.analysis_sentiment">
                    <span class="inline-flex items-center gap-1"
                          :class="{ 'text-green-400': msg.analysis_sentiment === 'positive', 'text-yellow-400': msg.analysis_sentiment === 'neutral', 'text-red-400': msg.analysis_sentiment === 'negative' }"
                          x-text="msg.analysis_sentiment === 'positive' ? '👍' : msg.analysis_sentiment === 'negative' ? '👎' : '➖'"></span>
                  </template>
                </div>
              </div>

              <!-- Expand indicator -->
              <div class="flex items-center gap-2 flex-shrink-0">
                <template x-if="msg.status === 'pending_review'">
                  <div class="flex gap-1.5">
                    <button @click.stop="approveMsg(msg)"
                            class="px-3 py-1.5 bg-green-500/10 text-green-400 border border-green-500/20 rounded-lg text-xs font-medium hover:bg-green-500/20 transition-colors">
                      Approve
                    </button>
                    <button @click.stop="rejectMsg(msg)"
                            class="px-3 py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-xs font-medium hover:bg-red-500/20 transition-colors">
                      Reject
                    </button>
                  </div>
                </template>
                <span class="text-slate-500 text-lg transition-transform duration-200"
                      :class="{ 'rotate-90': expanded[msg.task_id] }">→</span>
              </div>
            </div>

            <!-- Expanded detail -->
            <div x-show="expanded[msg.task_id]"
                 x-collapse
                 class="border-t border-slate-700/30">
              <!-- Loading analysis -->
              <div x-show="msg.analysis_loading" class="flex items-center justify-center py-8">
                <div class="w-6 h-6 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-sm text-slate-400 ml-3">Loading analysis...</span>
              </div>

              <template x-if="msg.analysis_loaded && !msg.analysis_loading">
                <div class="p-5 space-y-5">
                  <!-- Original message -->
                  <div>
                    <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-2">Original Message</h4>
                    <div class="p-3 bg-slate-700/20 rounded-lg text-sm text-slate-300 leading-relaxed whitespace-pre-wrap"
                         x-text="msg.original_body || msg.analysis?.message?.body || '(No body)'"></div>
                  </div>

                  <!-- Analysis grid -->
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="p-3 bg-slate-700/30 rounded-lg">
                      <span class="text-xs text-slate-500 block">Intent</span>
                      <span class="text-sm text-slate-200 font-medium capitalize"
                            x-text="msg.analysis?.analysis?.intent || msg.analysis_intent || '—'"></span>
                    </div>
                    <div class="p-3 bg-slate-700/30 rounded-lg">
                      <span class="text-xs text-slate-500 block">Sentiment</span>
                      <span class="text-sm font-medium capitalize"
                            :class="{
                              'text-green-400': (msg.analysis?.analysis?.sentiment || msg.analysis_sentiment) === 'positive',
                              'text-yellow-400': (msg.analysis?.analysis?.sentiment || msg.analysis_sentiment) === 'neutral',
                              'text-red-400': (msg.analysis?.analysis?.sentiment || msg.analysis_sentiment) === 'negative'
                            }"
                            x-text="msg.analysis?.analysis?.sentiment || msg.analysis_sentiment || '—'"></span>
                    </div>
                    <div class="p-3 bg-slate-700/30 rounded-lg">
                      <span class="text-xs text-slate-500 block">Urgency</span>
                      <span class="text-sm text-slate-200 font-medium capitalize"
                            x-text="msg.analysis?.analysis?.urgency || '—'"></span>
                    </div>
                    <div class="p-3 bg-slate-700/30 rounded-lg">
                      <span class="text-xs text-slate-500 block">Confidence</span>
                      <span class="text-sm text-slate-200 font-medium"
                            x-text="msg.analysis?.analysis?.confidence != null ? (msg.analysis.analysis.confidence * 100).toFixed(0) + '%' : '—'"></span>
                    </div>
                  </div>

                  <!-- Lead action -->
                  <template x-if="msg.analysis?.lead_action?.action">
                    <div class="p-3 bg-cyan-500/5 border border-cyan-500/10 rounded-lg">
                      <span class="text-xs text-slate-500 block mb-1">Recommended Action</span>
                      <span class="text-sm text-cyan-400 font-medium capitalize"
                            x-text="msg.analysis.lead_action.action?.replace('_', ' ')"></span>
                      <span x-show="msg.analysis.lead_action.status_update"
                            class="text-xs text-slate-400 ml-2">(status: <span class="text-slate-300" x-text="msg.analysis.lead_action.status_update"></span>)</span>
                    </div>
                  </template>

                  <!-- Suggested reply -->
                  <template x-if="msg.analysis?.suggested_reply?.body">
                    <div>
                      <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-2">Suggested Reply</h4>
                      <div class="border border-slate-700 rounded-lg overflow-hidden">
                        <div class="bg-slate-700/50 px-4 py-2 border-b border-slate-700 flex items-center gap-2">
                          <span class="text-xs text-slate-400">📧</span>
                          <span class="text-sm text-slate-300 font-medium"
                                x-text="msg.analysis.suggested_reply.subject || 'Re: ' + (msg.subject || '')"></span>
                        </div>
                        <div class="p-4 text-sm text-slate-300 leading-relaxed whitespace-pre-wrap"
                             x-text="msg.analysis.suggested_reply.body"></div>
                      </div>
                    </div>
                  </template>

                  <!-- Approve/Reject in expanded view -->
                  <template x-if="msg.status === 'pending_review'">
                    <div class="flex gap-3 pt-2 border-t border-slate-700/30">
                      <button @click.stop="approveMsg(msg)"
                              class="flex-1 px-4 py-2.5 bg-green-500/10 text-green-400 border border-green-500/20 rounded-lg text-sm font-medium hover:bg-green-500/20 transition-colors">
                        ✅ Approve Reply
                      </button>
                      <button @click.stop="rejectMsg(msg)"
                              class="flex-1 px-4 py-2.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-sm font-medium hover:bg-red-500/20 transition-colors">
                        ❌ Reject Reply
                      </button>
                    </div>
                  </template>

                  <!-- Approval summary -->
                  <template x-if="msg.status !== 'pending_review' && msg.approval_summary">
                    <div class="p-3 rounded-lg text-xs"
                          :class="{
                            'bg-green-900/10 border border-green-800/30 text-green-400': msg.status === 'approved',
                            'bg-red-900/10 border border-red-800/30 text-red-400': msg.status === 'rejected'
                          }">
                      <span class="font-medium capitalize" x-text="msg.status"></span>
                      <span x-show="msg.approval_summary.reviewed_by" x-text="' by ' + msg.approval_summary.reviewed_by"></span>
                      <span x-show="msg.approval_summary.reviewed_at" x-text="' · ' + timeAgo(msg.approval_summary.reviewed_at)"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script>
function inboundApp() {
  return {
    loading: true,
    messages: [],
    expanded: {},

    async init() {
      await this.loadMessages();
      this.loading = false;
    },

    async loadMessages() {
      try {
        const res = await fetch('/api/v1/activity?agent_type=inbound&limit=20');
        const data = await res.json();
        const tasks = (data.tasks || []).filter(t => t.agent_type === 'inbound');

        // Load each inbound message's analysis details
        const details = await Promise.all(
          tasks.map(async (t) => {
            try {
              const r = await fetch('/api/v1/inbound/' + t.task_id);
              if (!r.ok) return null;
              const analysis = await r.json();
              return {
                task_id: t.task_id,
                message_id: analysis.message_id,
                from_name: analysis.message?.from_name || '',
                from_email: analysis.message?.from_email || '',
                subject: analysis.message?.subject || '',
                channel: analysis.message?.channel || 'email',
                original_body: analysis.message?.body || '',
                status: analysis.approval_summary?.status || 'pending_review',
                analysis_intent: analysis.analysis?.intent,
                analysis_sentiment: analysis.analysis?.sentiment,
                analysis_urgency: analysis.analysis?.urgency,
                analysis_confidence: analysis.analysis?.confidence,
                analysis: analysis,
                approval_summary: analysis.approval_summary,
                created_at: t.created_at,
                analysis_loading: false,
                analysis_loaded: true,
              };
            } catch (e) {
              return null;
            }
          })
        );

        this.messages = details.filter(m => m !== null)
          .sort((a, b) => {
            // Pending review first, then by date
            if (a.status === 'pending_review' && b.status !== 'pending_review') return -1;
            if (a.status !== 'pending_review' && b.status === 'pending_review') return 1;
            return new Date(b.created_at) - new Date(a.created_at);
          });
      } catch (e) {
        console.error('Failed to load inbound messages:', e);
      }
    },

    toggleExpand(taskId) {
      this.expanded[taskId] = !this.expanded[taskId];
    },

    async approveMsg(msg) {
      const id = msg.message_id || msg.task_id;
      if (!id) return;
      try {
        const res = await fetch('/api/v1/inbound/' + id + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approved_by: 'BDR' }),
        });
        if (res.ok) {
          msg.status = 'approved';
          if (msg.approval_summary) {
            msg.approval_summary.status = 'approved';
            msg.approval_summary.reviewed_by = 'BDR';
            msg.approval_summary.reviewed_at = new Date().toISOString();
          }
        }
      } catch (e) {
        console.error('Failed to approve reply:', e);
      }
    },

    async rejectMsg(msg) {
      const id = msg.message_id || msg.task_id;
      if (!id) return;
      try {
        const res = await fetch('/api/v1/inbound/' + id + '/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rejected_reason: 'Needs revision' }),
        });
        if (res.ok) {
          msg.status = 'rejected';
          if (msg.approval_summary) {
            msg.approval_summary.status = 'rejected';
            msg.approval_summary.reviewed_by = 'BDR';
            msg.approval_summary.reviewed_at = new Date().toISOString();
          }
        }
      } catch (e) {
        console.error('Failed to reject reply:', e);
      }
    }
  };
}
</script>
{% endblock %}
