{% extends "base.html" %}
{% set active_nav = "leads" %}

{% block title %}Lead — ScoutOS Mission Control{% endblock %}
{% block heading %}Lead Detail{% endblock %}

{% block content %}
<div x-data="leadDetailApp('{{ lead_id }}')" x-init="init()" class="space-y-6">
  <!-- Skeleton loading -->
  <div x-show="loading" class="space-y-6">
    <div class="flex items-center gap-3">
      <div class="skeleton skeleton-text-sm w-16"></div>
      <div class="skeleton skeleton-text w-48"></div>
      <div class="skeleton skeleton-text-sm w-20"></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <template x-for="i in 4" :key="i">
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <div class="skeleton skeleton-title"></div>
          <div class="space-y-3 mt-4">
            <template x-for="j in 4" :key="j">
              <div class="flex justify-between">
                <div class="skeleton skeleton-text-sm w-20"></div>
                <div class="skeleton skeleton-text-sm w-32"></div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Error -->
  <div x-show="error" class="bg-red-900/20 border border-red-800 rounded-xl p-6 text-center">
    <p class="text-red-400 text-sm" x-text="error"></p>
    <a href="/leads" class="inline-block mt-3 text-xs text-cyan-400 hover:text-cyan-300">← Back to leads</a>
  </div>

  <template x-if="!loading && !error">
    <div class="space-y-6">
      <!-- Back link + company name -->
      <div class="flex items-center gap-3">
        <a href="/leads" class="text-sm text-slate-500 hover:text-slate-300 transition-colors">← Leads</a>
        <span class="text-slate-600">/</span>
        <h2 class="text-xl font-semibold text-slate-100" x-text="company.name || 'Unknown Company'"></h2>
        <span class="text-xs bg-slate-800 px-2 py-1 rounded-full text-slate-400 border border-slate-700 capitalize" x-text="company.current_stage?.replace('_', ' ') || 'new'"></span>
      </div>

      <!-- 4-card grid -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Card 1: Company Profile -->
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-lg">🏢</span>
            <h3 class="text-sm font-semibold text-slate-200 uppercase tracking-wider">Company Profile</h3>
          </div>
          <div class="space-y-3">
            <div class="flex justify-between">
              <span class="text-sm text-slate-400">Industry</span>
              <span class="text-sm text-slate-200" x-text="company.industry || '—'"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-slate-400">Employees</span>
              <span class="text-sm text-slate-200" x-text="company.employee_count || '—'"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-slate-400">Location</span>
              <span class="text-sm text-slate-200" x-text="company.location || '—'"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-slate-400">Domain</span>
              <span class="text-sm text-slate-200" x-text="company.domain || '—'"></span>
            </div>
            <div class="pt-2 border-t border-slate-700/30">
              <p class="text-sm text-slate-400 leading-relaxed" x-text="company.description || 'No description available.'"></p>
            </div>
          </div>
          <template x-if="company.business_signals?.length">
            <div class="mt-4 pt-4 border-t border-slate-700/30">
              <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-2">Business Signals</h4>
              <div class="flex flex-wrap gap-2">
                <template x-for="signal in company.business_signals" :key="signal">
                  <span class="text-xs bg-blue-900/20 text-blue-400 px-2 py-1 rounded-full border border-blue-800/30" x-text="signal"></span>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Card 2: Qualification -->
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-lg">📊</span>
            <h3 class="text-sm font-semibold text-slate-200 uppercase tracking-wider">Qualification</h3>
          </div>

          <template x-if="!qualification">
            <div class="text-center py-6">
              <p class="text-sm text-slate-500">Not yet qualified.</p>
              <button class="mt-3 px-4 py-2 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-lg text-sm hover:bg-cyan-500/20 transition-colors">
                Qualify this lead
              </button>
            </div>
          </template>

          <template x-if="qualification">
            <div class="space-y-4">
              <!-- Score gauge -->
              <div class="flex items-center gap-4">
                <div class="relative w-20 h-20 flex items-center justify-center">
                  <svg class="w-20 h-20 -rotate-90" viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="34" fill="none" stroke="#1e293b" stroke-width="6"/>
                    <circle cx="40" cy="40" r="34" fill="none" stroke-width="6"
                            stroke-dasharray="213.6"
                            :stroke-dashoffset="213.6 - (213.6 * (qualification.overall_score / 100))"
                            :stroke="qualification.overall_score >= 70 ? '#22c55e' : qualification.overall_score >= 40 ? '#eab308' : '#ef4444'"
                            class="gauge-animate transition-all duration-1000"/>
                  </svg>
                  <span class="absolute text-lg font-bold" x-text="qualification.overall_score"
                        :class="{'text-green-400': qualification.overall_score >= 70, 'text-yellow-400': qualification.overall_score >= 40 && qualification.overall_score < 70, 'text-red-400': qualification.overall_score < 40}">
                  </span>
                </div>
                <div class="flex-1 space-y-2">
                  <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-400">ICP Match</span>
                    <span class="text-slate-300 font-medium" x-text="qualification.icp_match_score"></span>
                  </div>
                  <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 rounded-full transition-all duration-700" :style="'width: ' + qualification.icp_match_score + '%'"></div>
                  </div>
                  <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-400">Buying Signal</span>
                    <span class="text-slate-300 font-medium" x-text="qualification.buying_signal_score"></span>
                  </div>
                  <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-full bg-purple-500 rounded-full transition-all duration-700" :style="'width: ' + qualification.buying_signal_score + '%'"></div>
                  </div>
                  <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-400">Company Fit</span>
                    <span class="text-slate-300 font-medium" x-text="qualification.company_fit_score"></span>
                  </div>
                  <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-full bg-teal-500 rounded-full transition-all duration-700" :style="'width: ' + qualification.company_fit_score + '%'"></div>
                  </div>
                </div>
              </div>

              <!-- Priority badge -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500">Priority:</span>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-green-900/30 text-green-400 border border-green-800': qualification.priority === 'HOT',
                        'bg-yellow-900/30 text-yellow-400 border border-yellow-800': qualification.priority === 'WARM',
                        'bg-slate-700/50 text-slate-400 border border-slate-600': qualification.priority === 'COLD'
                      }"
                      x-text="qualification.priority"></span>
              </div>

              <!-- Reasons -->
              <template x-if="qualification.reasons?.length">
                <div>
                  <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1.5">Reasons</h4>
                  <ul class="space-y-1">
                    <template x-for="r in qualification.reasons" :key="r">
                      <li class="text-xs text-green-400 flex items-start gap-1.5">
                        <span class="mt-0.5">+</span>
                        <span x-text="r"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>

              <!-- Risks -->
              <template x-if="qualification.risks?.length">
                <div>
                  <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1.5">Risks</h4>
                  <ul class="space-y-1">
                    <template x-for="r in qualification.risks" :key="r">
                      <li class="text-xs text-red-400 flex items-start gap-1.5">
                        <span class="mt-0.5">−</span>
                        <span x-text="r"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Card 3: Outreach Draft -->
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-lg">✉️</span>
            <h3 class="text-sm font-semibold text-slate-200 uppercase tracking-wider">Outreach Draft</h3>
          </div>

          <template x-if="!outreach">
            <div class="text-center py-6">
              <p class="text-sm text-slate-500">No outreach draft generated yet.</p>
            </div>
          </template>

          <template x-if="outreach">
            <div class="space-y-4">
              <!-- Status badge -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500">Status:</span>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-yellow-900/30 text-yellow-400 border border-yellow-800': outreach.status === 'pending_approval',
                        'bg-green-900/30 text-green-400 border border-green-800': outreach.status === 'approved',
                        'bg-red-900/30 text-red-400 border border-red-800': outreach.status === 'rejected'
                      }"
                      x-text="outreach.status?.replace('_', ' ')"></span>
              </div>

              <!-- Strategy -->
              <div class="grid grid-cols-2 gap-3 p-3 bg-slate-700/30 rounded-lg">
                <div>
                  <span class="text-xs text-slate-500 block">Channel</span>
                  <span class="text-sm text-slate-200 capitalize" x-text="outreach.strategy_channel || 'email'"></span>
                </div>
                <div>
                  <span class="text-xs text-slate-500 block">Urgency</span>
                  <span class="text-sm text-slate-200" x-text="outreach.strategy_urgency || '—'"></span>
                </div>
              </div>

              <!-- Personalization -->
              <div class="space-y-2">
                <h4 class="text-xs text-slate-500 uppercase tracking-wider">Hook</h4>
                <p class="text-sm text-slate-300 leading-relaxed" x-text="outreach.company_hook || '—'"></p>
              </div>
              <div class="space-y-2">
                <h4 class="text-xs text-slate-500 uppercase tracking-wider">Pain Point</h4>
                <p class="text-sm text-slate-300 leading-relaxed" x-text="outreach.detected_pain_point || '—'"></p>
              </div>

              <!-- Email subject -->
              <div class="p-3 bg-slate-700/30 rounded-lg">
                <span class="text-xs text-slate-500 block mb-1">Subject</span>
                <span class="text-sm text-slate-200 font-medium" x-text="outreach.draft_subject || '—'"></span>
              </div>

              <!-- Approve/Reject -->
              <template x-if="outreach.status === 'pending_approval'">
                <div class="flex gap-2 pt-2">
                  <button    @click="approveDraft(outreach.draft_id)"
                          class="flex-1 px-4 py-2 bg-green-500/10 text-green-400 border border-green-500/20 rounded-lg text-sm font-medium hover:bg-green-500/20 transition-colors btn-press">
                    ✅ Approve
                  </button>
                  <button @click="rejectDraft(outreach.draft_id)"
                          class="flex-1 px-4 py-2 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-sm font-medium hover:bg-red-500/20 transition-colors btn-press">
                    ❌ Reject
                  </button>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Card 4: Pipeline Position -->
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-lg">🚀</span>
            <h3 class="text-sm font-semibold text-slate-200 uppercase tracking-wider">Pipeline Position</h3>
          </div>

          <template x-if="!pipeline">
            <div class="text-center py-6">
              <p class="text-sm text-slate-500">Pipeline evaluation not available.</p>
            </div>
          </template>

          <template x-if="pipeline">
            <div class="space-y-4">
              <!-- Stage + Health -->
              <div class="grid grid-cols-2 gap-3">
                <div class="p-3 bg-slate-700/30 rounded-lg">
                  <span class="text-xs text-slate-500 block">Current Stage</span>
                  <span class="text-sm text-slate-200 font-medium capitalize" x-text="(pipeline.current_stage || 'new').replace('_', ' ')"></span>
                </div>
                <div class="p-3 bg-slate-700/30 rounded-lg">
                  <span class="text-xs text-slate-500 block">Stage Health</span>
                  <span class="inline-flex items-center gap-1.5 text-sm font-medium mt-0.5"
                        :class="{
                          'text-green-400': pipeline.stage_health === 'healthy',
                          'text-yellow-400': pipeline.stage_health === 'stale',
                          'text-red-400': pipeline.stage_health === 'critical'
                        }">
                    <span class="w-2 h-2 rounded-full"
                          :class="{
                            'bg-green-500': pipeline.stage_health === 'healthy',
                            'bg-yellow-500': pipeline.stage_health === 'stale',
                            'bg-red-500': pipeline.stage_health === 'critical'
                          }"></span>
                    <span class="capitalize" x-text="pipeline.stage_health || 'unknown'"></span>
                  </span>
                </div>
              </div>

              <!-- Stats -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <span class="text-xs text-slate-500 block">Days in Stage</span>
                  <span class="text-lg font-semibold text-slate-200" x-text="pipeline.days_in_stage || 0"></span>
                </div>
                <div>
                  <span class="text-xs text-slate-500 block">Stagnation Risk</span>
                  <span class="text-sm font-medium capitalize"
                        :class="{
                          'text-green-400': pipeline.stagnation_risk === 'low',
                          'text-yellow-400': pipeline.stagnation_risk === 'moderate',
                          'text-red-400': pipeline.stagnation_risk === 'high'
                        }"
                        x-text="pipeline.stagnation_risk || 'unknown'"></span>
                </div>
              </div>

              <!-- Recommended action -->
              <div class="p-3 bg-cyan-500/5 border border-cyan-500/10 rounded-lg">
                <span class="text-xs text-slate-500 block mb-1">Recommended Action</span>
                <span class="text-sm text-cyan-400" x-text="pipeline.recommended_action?.action || 'No recommendation available.'"></span>
                <p class="text-xs text-slate-500 mt-1" x-text="pipeline.recommended_action?.reasoning"></p>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function leadDetailApp(leadId) {
  return {
    loading: true,
    error: null,
    company: {},
    qualification: null,
    outreach: null,
    pipeline: null,

    async init() {
      try {
        // Load leads list to find this lead
        const res = await fetch('/api/v1/pipeline/leads');
        const data = await res.json();
        const leads = data.leads || [];
        const lead = leads.find(l => l.lead_id === leadId);

        if (!lead) {
          this.error = 'Lead not found.';
          this.loading = false;
          return;
        }

        this.company = lead;
        this.loading = false;

        // Try to load qualification data from agent tasks
        await this.loadAgentData();
      } catch (e) {
        this.error = 'Failed to load lead data: ' + e.message;
        this.loading = false;
      }
    },

    async loadAgentData() {
      try {
        const res = await fetch('/api/v1/activity?limit=50');
        const data = await res.json();
        const tasks = data.tasks || [];

        // Find qualification task for this lead
        const qualTask = tasks.find(t =>
          t.agent_type === 'qualification' &&
          t.company_name === this.company.company_name &&
          t.status === 'completed'
        );
        if (qualTask) {
          const taskRes = await fetch('/api/v1/qualification/' + qualTask.task_id);
          if (taskRes.ok) {
            const q = await taskRes.json();
            this.qualification = q;
          }
        }

        // Find outreach task for this lead
        const outTask = tasks.find(t =>
          t.agent_type === 'outreach' &&
          t.company_name === this.company.company_name
        );
        if (outTask) {
          const taskRes = await fetch('/api/v1/outreach/' + outTask.task_id);
          if (taskRes.ok) {
            const o = await taskRes.json();
            this.outreach = {
              ...o,
              draft_id: o.draft_id,
              status: o.approval_summary?.status || 'pending_approval',
              strategy_channel: o.outreach_strategy?.recommended_channel,
              strategy_urgency: o.outreach_strategy?.urgency,
              company_hook: o.personalization?.company_hook,
              detected_pain_point: o.personalization?.detected_pain_point,
              draft_subject: o.email_draft?.subject,
            };
          }
        }

        // Find pipeline task for this lead
        const pipeTask = tasks.find(t =>
          t.agent_type === 'pipeline' &&
          t.company_name === this.company.company_name &&
          t.status === 'completed'
        );
        if (pipeTask) {
          const taskRes = await fetch('/api/v1/pipeline/' + pipeTask.task_id);
          if (taskRes.ok) {
            const p = await taskRes.json();
            this.pipeline = {
              current_stage: p.evaluation?.current_stage,
              stage_health: p.evaluation?.stage_health,
              days_in_stage: p.evaluation?.days_in_stage,
              stagnation_risk: p.evaluation?.stagnation_risk,
              recommended_action: p.recommended_action,
            };
          }
        }
      } catch (e) {
        console.error('Failed to load agent data:', e);
      }
    },

    async approveDraft(draftId) {
      if (!draftId) return;
      try {
        const res = await fetch('/api/v1/outreach/' + draftId + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approved_by: 'BDR' }),
        });
        if (res.ok) {
          if (this.outreach) this.outreach.status = 'approved';
        }
      } catch (e) {
        console.error('Failed to approve draft:', e);
      }
    },

    async rejectDraft(draftId) {
      if (!draftId) return;
      try {
        const res = await fetch('/api/v1/outreach/' + draftId + '/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rejected_reason: 'Needs revision' }),
        });
        if (res.ok) {
          if (this.outreach) this.outreach.status = 'rejected';
        }
      } catch (e) {
        console.error('Failed to reject draft:', e);
      }
    }
  };
}
</script>
{% endblock %}
