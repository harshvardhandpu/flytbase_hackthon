{% extends "base.html" %}
{% set active_nav = "activity" %}

{% block title %}Activity — ScoutOS Mission Control{% endblock %}
{% block heading %}Agent Activity{% endblock %}

{% block content %}
<div x-data="activityApp()" x-init="init()" class="space-y-6">
  <!-- Skeleton loading -->
  <div x-show="loading" class="space-y-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <template x-for="i in 4" :key="i">
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <div class="skeleton skeleton-text-sm"></div>
          <div class="skeleton skeleton-text w-12 mt-2"></div>
        </div>
      </template>
    </div>
    <div class="flex gap-1.5">
      <template x-for="i in 6" :key="i">
        <div class="skeleton skeleton-text-sm w-20 h-8"></div>
      </template>
    </div>
    <template x-for="i in 4" :key="i">
      <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-5">
        <div class="flex items-center gap-3">
          <div class="skeleton skeleton-circle"></div>
          <div class="flex-1">
            <div class="skeleton skeleton-text w-1/3"></div>
            <div class="skeleton skeleton-text-sm w-2/3 mt-1"></div>
          </div>
          <div class="skeleton skeleton-text-sm w-16"></div>
        </div>
      </div>
    </template>
  </div>

  <template x-if="!loading">
    <div class="space-y-6">
      <!-- Stats bar -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Total Tasks</span>
          <div class="text-2xl font-semibold text-slate-100 mt-1" x-text="tasks.length">0</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Completed</span>
          <div class="text-2xl font-semibold text-green-400 mt-1" x-text="tasks.filter(t => t.status === 'completed').length">0</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Pending Approval</span>
          <div class="text-2xl font-semibold text-yellow-400 mt-1" x-text="tasks.filter(t => t.status === 'waiting_for_approval').length">0</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/50">
          <span class="text-slate-400 text-xs font-medium">Failed</span>
          <div class="text-2xl font-semibold text-red-400 mt-1" x-text="tasks.filter(t => t.status === 'failed').length">0</div>
        </div>
      </div>

      <!-- Filters bar -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex gap-1.5 bg-slate-800 rounded-lg p-1 border border-slate-700/50">
          <button @click="filterType = ''; filterTasks()"
                  class="px-3 py-1.5 text-xs font-medium rounded-md transition-all"
                  :class="filterType === '' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:text-slate-200'">
            All
          </button>
          <button @click="filterType = 'research'; filterTasks()"
                  class="px-3 py-1.5 text-xs font-medium rounded-md transition-all capitalize"
                  :class="filterType === 'research' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:text-slate-200'">
            🔍 Research
          </button>
          <button @click="filterType = 'qualification'; filterTasks()"
                  class="px-3 py-1.5 text-xs font-medium rounded-md transition-all capitalize"
                  :class="filterType === 'qualification' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' : 'text-slate-400 hover:text-slate-200'">
            📊 Qualify
          </button>
          <button @click="filterType = 'outreach'; filterTasks()"
                  class="px-3 py-1.5 text-xs font-medium rounded-md transition-all capitalize"
                  :class="filterType === 'outreach' ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'text-slate-400 hover:text-slate-200'">
            ✉️ Outreach
          </button>
          <button @click="filterType = 'inbound'; filterTasks()"
                  class="px-3 py-1.5 text-xs font-medium rounded-md transition-all capitalize"
                  :class="filterType === 'inbound' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' : 'text-slate-400 hover:text-slate-200'">
            📨 Inbound
          </button>
          <button @click="filterType = 'pipeline'; filterTasks()"
                  class="px-3 py-1.5 text-xs font-medium rounded-md transition-all capitalize"
                  :class="filterType === 'pipeline' ? 'bg-teal-500/20 text-teal-400 border border-teal-500/30' : 'text-slate-400 hover:text-slate-200'">
            🚀 Pipeline
          </button>
        </div>

        <label for="filter-status" class="sr-only">Filter by task status</label>
        <select id="filter-status" x-model="filterStatus" @change="filterTasks()"
                class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/50">
          <option value="">All Status</option>
          <option value="completed">Completed</option>
          <option value="waiting_for_approval">Pending Approval</option>
          <option value="failed">Failed</option>
          <option value="running">Running</option>
          <option value="pending">Pending</option>
        </select>

        <span class="text-xs text-slate-500" x-text="`${filteredTasks.length} task${filteredTasks.length !== 1 ? 's' : ''}`"></span>
      </div>

      <!-- Task list -->
      <template x-if="filteredTasks.length === 0">
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-12 text-center">
          <span class="text-4xl block mb-3">⚡</span>
          <p class="text-slate-500 text-sm">No tasks found for the selected filters.</p>
        </div>
      </template>

      <div class="space-y-3">
        <template x-for="task in filteredTasks" :key="task.task_id">
          <div class="bg-slate-800 rounded-xl border border-slate-700/50 overflow-hidden transition-all duration-200">
            <!-- Task header (clickable to expand) -->
            <div class="flex items-start gap-4 p-5 cursor-pointer hover:bg-slate-700/30 transition-colors"
                 @click="toggleExpand(task.task_id)"
                 :class="{ 'border-b border-slate-700/30': expanded[task.task_id] }">
              <!-- Agent type icon + color -->
              <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
                   :class="{
                     'bg-blue-500/10 border border-blue-500/20': task.agent_type === 'research',
                     'bg-purple-500/10 border border-purple-500/20': task.agent_type === 'qualification',
                     'bg-green-500/10 border border-green-500/20': task.agent_type === 'outreach',
                     'bg-orange-500/10 border border-orange-500/20': task.agent_type === 'inbound',
                     'bg-teal-500/10 border border-teal-500/20': task.agent_type === 'pipeline'
                   }">
                <span class="text-lg"
                      :class="{
                        'text-blue-400': task.agent_type === 'research',
                        'text-purple-400': task.agent_type === 'qualification',
                        'text-green-400': task.agent_type === 'outreach',
                        'text-orange-400': task.agent_type === 'inbound',
                        'text-teal-400': task.agent_type === 'pipeline'
                      }"
                      x-text="{
                        research: '🔍',
                        qualification: '📊',
                        outreach: '✉️',
                        inbound: '📨',
                        pipeline: '🚀'
                      }[task.agent_type] || '⚡'">
                </span>
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-0.5">
                  <span class="text-sm font-medium text-slate-200 capitalize" x-text="task.agent_type"></span>
                  <span x-show="task.company_name" class="text-sm text-slate-400">· <span x-text="task.company_name"></span></span>
                </div>
                <p class="text-sm text-slate-400 truncate" x-text="task.summary || 'No summary'"></p>
                <div class="flex items-center gap-3 mt-1 text-xs text-slate-500">
                  <span x-text="timeAgo(task.completed_at || task.created_at)"></span>
                  <span x-show="task.log_count > 0" x-text="task.log_count + ' step' + (task.log_count !== 1 ? 's' : '')"></span>
                  <span x-show="task.requires_human_approval" class="text-yellow-500">⏳ awaiting review</span>
                </div>
              </div>

              <!-- Status badge + expand arrow -->
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-green-900/30 text-green-400 border border-green-800': task.status === 'completed',
                        'bg-yellow-900/30 text-yellow-400 border border-yellow-800': task.status === 'waiting_for_approval',
                        'bg-red-900/30 text-red-400 border border-red-800': task.status === 'failed',
                        'bg-blue-900/30 text-blue-400 border border-blue-800': task.status === 'running',
                        'bg-slate-700/50 text-slate-400 border border-slate-600': task.status === 'pending'
                      }"
                      x-text="task.status === 'waiting_for_approval' ? 'pending' : task.status">
                </span>
                <span class="text-slate-500 text-lg transition-transform duration-200"
                      :class="{ 'rotate-90': expanded[task.task_id] }">→</span>
              </div>
            </div>

            <!-- Expanded detail: step-level logs -->
            <div x-show="expanded[task.task_id]"
                 x-collapse
                 class="px-5 py-4 space-y-4">
              <!-- Loading logs -->
              <div x-show="logLoading[task.task_id]" class="flex items-center gap-2 text-sm text-slate-400">
                <div class="w-4 h-4 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                Loading steps...
              </div>

              <template x-if="!logLoading[task.task_id]">
                <div class="space-y-3">
                  <!-- Task details -->
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="p-2.5 bg-slate-700/30 rounded-lg">
                      <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Task ID</span>
                      <span class="text-xs text-slate-300 font-mono truncate block mt-0.5" x-text="task.task_id.slice(0, 8) + '...'"></span>
                    </div>
                    <div class="p-2.5 bg-slate-700/30 rounded-lg">
                      <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Agent</span>
                      <span class="text-xs text-slate-300 capitalize block mt-0.5" x-text="task.agent_type"></span>
                    </div>
                    <div class="p-2.5 bg-slate-700/30 rounded-lg">
                      <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Status</span>
                      <span class="text-xs font-medium block mt-0.5 capitalize"
                            :class="{
                              'text-green-400': task.status === 'completed',
                              'text-yellow-400': task.status === 'waiting_for_approval',
                              'text-red-400': task.status === 'failed'
                            }"
                            x-text="task.status.replace('_', ' ')"></span>
                    </div>
                    <div class="p-2.5 bg-slate-700/30 rounded-lg">
                      <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Approval</span>
                      <span class="text-xs text-slate-300 block mt-0.5" x-text="task.requires_human_approval ? 'Required' : 'Auto'"></span>
                    </div>
                  </div>

                  <!-- Step timeline -->
                  <div>
                    <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-3">Execution Steps</h4>
                    <template x-if="!task.logs || task.logs.length === 0">
                      <div class="text-center py-6 text-slate-600 text-xs">
                        <span class="block text-lg mb-1">📝</span>
                        No step logs available for this task.
                      </div>
                    </template>
                    <div class="space-y-0 relative">
                      <!-- Timeline line -->
                      <div class="absolute left-[7px] top-2 bottom-2 w-0.5 bg-slate-700"></div>
                      <template x-for="(log, idx) in task.logs" :key="log.id || idx">
                        <div class="flex items-start gap-4 pb-4 last:pb-0 relative">
                          <!-- Timeline dot -->
                          <div class="w-4 h-4 rounded-full flex-shrink-0 mt-0.5 z-10 flex items-center justify-center"
                               :class="{
                                 'bg-green-500/20 border border-green-500': log.level === 'info',
                                 'bg-yellow-500/20 border border-yellow-500': log.level === 'warning',
                                 'bg-red-500/20 border border-red-500': log.level === 'error'
                               }">
                            <span class="w-1.5 h-1.5 rounded-full"
                                  :class="{
                                    'bg-green-500': log.level === 'info',
                                    'bg-yellow-500': log.level === 'warning',
                                    'bg-red-500': log.level === 'error'
                                  }"></span>
                          </div>

                          <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                              <span class="text-sm font-medium text-slate-200 capitalize"
                                    x-text="log.event_type?.replace(/_/g, ' ') || log.message?.split(':')[0] || 'step'"></span>
                              <span class="text-[10px] text-slate-600 font-mono" x-text="log.level?.toUpperCase() || 'INFO'"></span>
                            </div>
                            <p class="text-xs text-slate-400 mt-0.5" x-text="log.message || ''"></p>
                            <p x-show="log.created_at" class="text-[10px] text-slate-600 mt-0.5" x-text="timeAgo(log.created_at)"></p>

                            <!-- Raw data preview -->
                            <template x-if="log.data && Object.keys(log.data).length > 0">
                              <div class="mt-2">
                                <button @click.stop="log._showData = !log._showData"
                                        class="text-[10px] text-cyan-500 hover:text-cyan-400 transition-colors">
                                  <span x-text="log._showData ? '▼ Hide data' : '▶ Show data'"></span>
                                </button>
                                <pre x-show="log._showData"
                                     class="mt-1 p-2 bg-slate-900/50 rounded border border-slate-700 text-[10px] text-slate-400 font-mono overflow-x-auto"
                                     x-text="JSON.stringify(log.data, null, 2)"></pre>
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script>
function activityApp() {
  return {
    loading: true,
    tasks: [],
    filteredTasks: [],
    expanded: {},
    logLoading: {},
    filterType: '',
    filterStatus: '',

    async init() {
      await this.loadTasks();
      this.loading = false;
    },

    async loadTasks() {
      try {
        const res = await fetch('/api/v1/activity?limit=50');
        const data = await res.json();
        this.tasks = data.tasks || [];
        this.filterTasks();
      } catch (e) {
        console.error('Failed to load tasks:', e);
      }
    },

    filterTasks() {
      let result = [...this.tasks];
      if (this.filterType) {
        result = result.filter(t => t.agent_type === this.filterType);
      }
      if (this.filterStatus) {
        result = result.filter(t => t.status === this.filterStatus);
      }
      this.filteredTasks = result;
    },

    async toggleExpand(taskId) {
      this.expanded[taskId] = !this.expanded[taskId];
      if (this.expanded[taskId] && !this.logLoading[taskId]) {
        // Load logs on first expand
        const task = this.tasks.find(t => t.task_id === taskId);
        if (task && (!task.logs || task.logs.length === 0)) {
          this.logLoading[taskId] = true;            try {
              const res = await fetch(`/api/v1/activity/tasks/${taskId}/logs`);
              if (res.ok) {
                const data = await res.json();
                task.logs = data.logs || [];
              } else {
                task.logs = [];
              }
          } catch (e) {
            console.error('Failed to load logs:', e);
            task.logs = [];
          } finally {
            this.logLoading[taskId] = false;
          }
        } else if (!task) {
          this.logLoading[taskId] = false;
        } else {
          this.logLoading[taskId] = false;
        }
      }
    }
  };
}
</script>
{% endblock %}
