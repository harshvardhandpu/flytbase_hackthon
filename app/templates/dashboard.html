{% extends "base.html" %}
{% set active_nav = "dashboard" %}

{% block heading %}Dashboard{% endblock %}

{% block content %}
<div x-data="dashboardApp()" x-init="init()" class="space-y-8">
  <!-- Skeleton loading -->
  <div x-show="loading" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <template x-for="i in 4" :key="i">
        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700/50">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text w-16 mt-3"></div>
          <div class="skeleton skeleton-text-sm mt-2"></div>
        </div>
      </template>
    </div>
    <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
      <div class="skeleton skeleton-title"></div>
      <div class="grid grid-cols-8 gap-3 mt-4">
        <template x-for="i in 8" :key="i">
          <div class="text-center">
            <div class="skeleton skeleton-text-sm mx-auto"></div>
            <div class="skeleton skeleton-text w-8 mx-auto mt-2"></div>
          </div>
        </template>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-card mt-3"></div>
        <div class="skeleton skeleton-card mt-2"></div>
      </div>
      <div class="lg:col-span-2 bg-slate-800 rounded-xl border border-slate-700/50 p-6">
        <div class="skeleton skeleton-title"></div>
        <div class="space-y-3 mt-4">
          <template x-for="i in 3" :key="i">
            <div class="flex items-center gap-3">
              <div class="skeleton skeleton-circle"></div>
              <div class="flex-1">
                <div class="skeleton skeleton-text w-3/4"></div>
                <div class="skeleton skeleton-text-sm mt-1"></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <template x-if="!loading">
    <div class="space-y-8">
      <!-- Stats Bar -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700/50 hover:border-slate-600 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 text-sm font-medium">Total Leads</span>
            <span class="text-blue-400 text-lg">👥</span>
          </div>
          <div class="text-3xl font-semibold text-slate-100 mt-2" x-text="stats.total_leads" x-ref="count_total">—</div>
          <div class="text-xs text-slate-500 mt-1">Active in pipeline</div>
        </div>

        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700/50 hover:border-slate-600 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 text-sm font-medium">HOT Leads</span>
            <span class="text-green-400 text-lg">🔥</span>
          </div>
          <div class="text-3xl font-semibold text-slate-100 mt-2" x-text="stats.hot_leads" x-ref="count_hot">—</div>
          <div class="text-xs text-slate-500 mt-1">Score ≥ 70</div>
        </div>

        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700/50 hover:border-slate-600 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 text-sm font-medium">Pending Approval</span>
            <span class="text-yellow-400 text-lg">⏳</span>
          </div>
          <div class="text-3xl font-semibold text-slate-100 mt-2" x-text="stats.pending_approvals" x-ref="count_pending">—</div>
          <div class="text-xs text-slate-500 mt-1">Awaiting review</div>
        </div>

        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700/50 hover:border-slate-600 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 text-sm font-medium">Needs Attention</span>
            <span class="text-red-400 text-lg">⚠️</span>
          </div>
          <div class="text-3xl font-semibold text-slate-100 mt-2" x-text="stats.stale_leads" x-ref="count_stale">—</div>
          <div class="text-xs text-slate-500 mt-1">Stale or critical</div>
        </div>
      </div>

      <!-- Pipeline Snapshot -->
      <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold text-slate-200">Pipeline Snapshot</h2>
          <a href="/pipeline" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors">View full pipeline →</a>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
          <template x-for="stage in pipeline_stages" :key="stage.name">
            <div class="text-center">
              <div class="text-xs text-slate-500 mb-1 capitalize" x-text="stage.display_name"></div>
              <div class="text-2xl font-semibold" x-text="stage.count" :class="stage.count > 0 ? 'text-slate-100' : 'text-slate-600'">0</div>
              <div class="flex gap-0.5 justify-center mt-1">
                <span class="w-2 h-2 rounded-full" :class="stage.healthy > 0 ? 'bg-green-500' : 'bg-slate-700'" x-show="stage.healthy > 0"></span>
                <span class="w-2 h-2 rounded-full" :class="stage.stale > 0 ? 'bg-yellow-500' : 'bg-slate-700'" x-show="stage.stale > 0"></span>
                <span class="w-2 h-2 rounded-full" :class="stage.critical > 0 ? 'bg-red-500' : 'bg-slate-700'" x-show="stage.critical > 0"></span>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Quick Actions + Activity Feed -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Quick Actions -->
        <div class="bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <h2 class="text-base font-semibold text-slate-200 mb-4">Quick Actions</h2>
          <div class="space-y-3">
            <button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 border border-cyan-500/20 transition-all text-sm font-medium">
              <span>🔍</span>
              <span>Research a new company</span>
            </button>
            <button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-slate-700/50 text-slate-300 hover:bg-slate-700 border border-slate-600/50 transition-all text-sm font-medium">
              <span>📨</span>
              <span>Process inbound message</span>
            </button>
            <a href="/outreach" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-slate-700/50 text-slate-300 hover:bg-slate-700 border border-slate-600/50 transition-all text-sm font-medium">
              <span>✅</span>
              <span>Review pending approvals</span>
            </a>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="lg:col-span-2 bg-slate-800 rounded-xl border border-slate-700/50 p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-semibold text-slate-200">Recent Activity</h2>
            <a href="/activity" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors">View all →</a>
          </div>

          <!-- Activity loading -->
          <div x-show="activity_loading" class="flex items-center justify-center py-8">
            <div class="w-6 h-6 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
          </div>

          <template x-if="!activity_loading && activity.length === 0">
            <div class="text-center py-8 text-slate-500 text-sm">No recent activity. Run a research task to get started.</div>
          </template>

          <div class="space-y-0">
            <template x-for="(item, idx) in activity" :key="item.task_id">
              <div class="flex items-start gap-3 py-3 border-b border-slate-700/30 last:border-b-0">
                <div class="w-2 h-2 mt-2 rounded-full flex-shrink-0"
                     :class="{
                       'bg-blue-500': item.agent_type === 'research',
                       'bg-purple-500': item.agent_type === 'qualification',
                       'bg-green-500': item.agent_type === 'outreach',
                       'bg-orange-500': item.agent_type === 'inbound',
                       'bg-teal-500': item.agent_type === 'pipeline'
                     }">
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm text-slate-200">
                    <span class="font-medium capitalize" x-text="item.agent_type"></span>
                    <span x-text="item.summary ? ' — ' + item.summary : ''"></span>
                  </p>
                  <p class="text-xs text-slate-500 mt-0.5" x-text="timeAgo(item.completed_at)"></p>
                </div>
                <span class="text-xs font-medium px-2 py-0.5 rounded-full flex-shrink-0"
                      :class="{
                        'bg-green-900/30 text-green-400 border border-green-800': item.status === 'completed',
                        'bg-yellow-900/30 text-yellow-400 border border-yellow-800': item.status === 'waiting_for_approval',
                        'bg-red-900/30 text-red-400 border border-red-800': item.status === 'failed'
                      }"
                      x-text="item.status === 'waiting_for_approval' ? 'pending' : item.status">
                </span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function dashboardApp() {
  return {
    loading: true,
    activity_loading: true,
    stats: { total_leads: 0, hot_leads: 0, pending_approvals: 0, stale_leads: 0 },
    pipeline_stages: [],
    activity: [],

    async init() {
      await Promise.all([
        this.loadStats(),
        this.loadPipeline(),
        this.loadActivity()
      ]);
      this.loading = false;
      // Animate stat counters after render
      this.$nextTick(() => this.animateCounters());
    },

    async animateCounters() {
      setTimeout(() => {
        animateValue(this.$refs.count_total, 0, this.stats.total_leads, 600);
        animateValue(this.$refs.count_hot, 0, this.stats.hot_leads, 600);
        animateValue(this.$refs.count_pending, 0, this.stats.pending_approvals, 600);
        animateValue(this.$refs.count_stale, 0, this.stats.stale_leads, 600);
      }, 100);
    },

    async loadStats() {
      try {
        const res = await fetch('/api/v1/pipeline/leads');
        const data = await res.json();
        const leads = data.leads || [];
        this.stats.total_leads = leads.length;
        this.stats.hot_leads = leads.filter(l => (l.overall_score || 0) >= 70).length;
        this.stats.stale_leads = leads.filter(l => l.stage_health === 'stale' || l.stage_health === 'critical').length;
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    },

    async loadPipeline() {
      try {
        const res = await fetch('/api/v1/pipeline/leads');
        const data = await res.json();
        const leads = data.leads || [];

        const stageOrder = ['new', 'researching', 'qualified', 'outreach', 'meeting_scheduled', 'negotiation', 'closed_won', 'closed_lost'];
        const stageNames = {
          'new': 'New', 'researching': 'Research', 'qualified': 'Qualified',
          'outreach': 'Outreach', 'meeting_scheduled': 'Meeting', 'negotiation': 'Negotiation',
          'closed_won': 'Won', 'closed_lost': 'Lost'
        };

        this.pipeline_stages = stageOrder.map(name => {
          const stageLeads = leads.filter(l => l.current_stage === name);
          return {
            name,
            display_name: stageNames[name] || name,
            count: stageLeads.length,
            healthy: stageLeads.filter(l => l.stage_health === 'healthy').length,
            stale: stageLeads.filter(l => l.stage_health === 'stale').length,
            critical: stageLeads.filter(l => l.stage_health === 'critical').length,
          };
        });

        this.stats.pending_approvals = leads.filter(l => l.current_stage === 'outreach').length;
      } catch (e) {
        console.error('Failed to load pipeline:', e);
      }
    },

    async loadActivity() {
      try {
        const res = await fetch('/api/v1/activity?limit=10');
        const data = await res.json();
        this.activity = data.tasks || [];
      } catch (e) {
        console.error('Failed to load activity:', e);
      } finally {
        this.activity_loading = false;
      }
    }
  };
}
</script>
{% endblock %}
