# ── ScoutOS — Local Deployment Testing ──────────────────────────────
# Start with:  docker compose up --build
# Access at:   http://localhost:8000
# ──────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoutos
      POSTGRES_PASSWORD: scoutos
      POSTGRES_DB: scoutos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://scoutos:scoutos@db:5432/scoutos
      AI_PROVIDER: freemodel
      ANTHROPIC_BASE_URL: https://cc.freemodel.dev
      ANTHROPIC_AUTH_TOKEN: replace-me
      SEARCH_PROVIDER: simulated
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
